name: Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *'

jobs:
  Bun:
    runs-on: ubuntu-latest

    # TradingView authenticated tests use the same account/session secrets.
    # Running every job at once makes the external websocket tests flaky.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - name: Use Bun
      uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Build artifacts
      run: bun run build:all
    - name: Typecheck
      run: bun run typecheck
    - name: Lint
      run: bun run lint
    - name: Run tests and pack validation
      run: bun test
      env:
        SESSION: ${{ secrets.TW_SESSION }}
        SIGNATURE: ${{ secrets.TW_SIGNATURE }}

  Node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
    - name: Use Bun
      uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Build artifacts
      run: bun run build:all
    - name: Typecheck
      run: bun run typecheck
    - name: Lint
      run: bun run lint
    - name: Run deterministic suites
      run: bun test tests/pack tests/fake-socket tests/unit
    - name: Run anonymous Node smoke
      if: matrix.node == 20
      run: node tests/live-smoke/anonymous.mjs